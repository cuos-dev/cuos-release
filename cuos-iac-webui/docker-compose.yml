services:
  cuos-iac-webui:
    image: "ghcr.io/cuos-dev/cuos-iac-webui:v0.1.0"
    x-digest: "sha256:8448e9888defa2cb9d9ed93aa266947ae4cf71d96048fe39edf8281455dcd5cc"
    container_name: cuos-iac-webui
    volumes:
      - type: bind
        source: /var/run/cuos.sock
        target: /var/run/cuos.sock
        bind:
          create_host_path: false
      - type: bind
        source: "${SYSTEM_CONFIG_PATH:-/system.json}"
        target: /system.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8030:3000"
    restart: always
#    profiles:
#      - dev

