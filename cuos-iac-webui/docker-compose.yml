services:
  cuos-iac-webui:
    image: "ghcr.io/cuos-dev/cuos-iac-webui:v0.5.0"
    x-digest: "sha256:62d9d240de7d2b2f92103876f27dac59f5f8fbc6c5e99c251fbe75186909aa2f"
    volumes:
      - type: bind
        source: "${SYSTEM_CONFIG_PATH:-/system.json}"
        target: /system.json
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: iac-socket
        target: /socket
    ports:
      - "8030:3000"
    restart: always

volumes:
  iac-socket:
    name: "${IAC_SOCKET_VOLUME:-iac-socket}"
    external: true
