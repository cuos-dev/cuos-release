services:
  cuos-iac-webui:
    image: "ghcr.io/cuos-dev/cuos-iac-webui:v0.2.0"
    x-digest: "sha256:2300e39756bc3e610b96a1d580e8408973e00460f8ab42487cbe89a4641e3ffc"
    container_name: cuos-iac-webui
    volumes:
      - type: bind
        source: /var/run/cuos.sock
        target: /var/run/cuos.sock
        bind:
          create_host_path: false
      - type: bind
        source: "${SYSTEM_CONFIG_PATH:-/system.json}"
        target: /system.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8030:3000"
    restart: always
#    profiles:
#      - dev

