services:
  cuos-iac-webui:
    image: "ghcr.io/cuos-dev/cuos-iac-webui:v0.2.1"
    x-digest: "sha256:e46affe218fa028c2396aa613e373cef8a6acb210978428baa92d50c7bb25905"
    container_name: cuos-iac-webui
    volumes:
      - type: bind
        source: /var/run/cuos.sock
        target: /var/run/cuos.sock
        bind:
          create_host_path: false
      - type: bind
        source: "${SYSTEM_CONFIG_PATH:-/system.json}"
        target: /system.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8030:3000"
    restart: always
#    profiles:
#      - dev

