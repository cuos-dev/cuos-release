services:
  cuos-iac-webui:
    image: "ghcr.io/cuos-dev/cuos-iac-webui:v0.2.1"
    x-digest: "sha256:e46affe218fa028c2396aa613e373cef8a6acb210978428baa92d50c7bb25905"
    volumes:
      - type: bind
        source: "${SYSTEM_CONFIG_PATH:-/system.json}"
        target: /system.json
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: iac-socket
        target: /socket
    ports:
      - "8030:3000"
    restart: always

volumes:
  iac-socket:
    name: "${IAC_SOCKET_VOLUME:-iac-socket}"
    external: true
