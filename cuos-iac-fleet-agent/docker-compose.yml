services:
  cuos-iac-fleet-agent:
    image: "ghcr.io/cuos-dev/cuos-iac-fleet-agent:v0.2.0"
    x-digest: "sha256:305fd66dc10a94da9d528231b4ec0cc84e4aee95f562e858818adc876d97c9d0"
    container_name: cuos-iac-fleet-agent
    volumes:
      - type: bind
        source: /var/run/cuos.sock
        target: /var/run/cuos.sock
        bind:
          create_host_path: false
      - type: bind
        source: "${SYSTEM_CONFIG_PATH:-/system.json}"
        target: /system.json
        read_only: true
        bind:
          create_host_path: false
    restart: always

