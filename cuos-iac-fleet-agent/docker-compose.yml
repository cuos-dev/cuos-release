services:
  cuos-iac-fleet-agent:
    image: "ghcr.io/cuos-dev/cuos-iac-fleet-agent:v0.2.1"
    x-digest: "sha256:ec9b0ace875381c29982a76ee7cc1844433ee7f842d882c57d085a3a0a2086e9"
    container_name: cuos-iac-fleet-agent
    volumes:
      - type: bind
        source: /var/run/cuos.sock
        target: /var/run/cuos.sock
        bind:
          create_host_path: false
      - type: bind
        source: "${SYSTEM_CONFIG_PATH:-/system.json}"
        target: /system.json
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: iac-socket
        target: /socket
    restart: always

volumes:
  iac-socket:
    external:
      name: "iac-socket"
